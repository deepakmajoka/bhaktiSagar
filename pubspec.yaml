name: bhaktisagar
description: "Bhakti Sagar: Aarti & Panchang app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  google_mobile_ads: ^5.1.0
  table_calendar: ^3.1.3
  firebase_core: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_ai: ^5.1.0
  firebase_auth: ^7.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

# Launcher Icons Configuration (Platforms added)
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Assets un-commented taaki images load ho sakein
  assets:
    - assets/images/
